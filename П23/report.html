<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Expenses report</title>
  <style>
    body { font-family: sans-serif; margin: 2rem; }
    table { border-collapse: collapse; }
    th, td { border: 1px solid #999; padding: 6px 12px; }
    th { background: #eee; }
    .num { text-align: right; }
  </style>
</head>
<body>
  <h1>Expenses report</h1>
  <table>
    <tr><th>Date</th><th>Category</th><th>Amount</th><th>Comment</th></tr>
    <tr><td>2026-10-01</td><td>food</td><td class="num">250.00</td><td>lunch and groceries</td></tr>
    <tr><td>2026-10-03</td><td>transport</td><td class="num">120.50</td><td>bus pass</td></tr>
    <tr><td>2026-10-07</td><td>books</td><td class="num">310.00</td><td>python textbook</td></tr>
    <tr><td>2026-10-12</td><td>entertainment</td><td class="num">200.00</td><td>cinema</td></tr>
    <tr><td>2026-10-15</td><td>food</td><td class="num">367.50</td><td>groceries</td></tr>
    <tr><th colspan="2">Total</th><th class="num">1248.00</th><th></th></tr>
  </table>
</body>
</html>
